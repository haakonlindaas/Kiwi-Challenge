map.on('load',()=>{
map.addSource('kiwi-stores',{type:'geojson',data:makeGeoJSON(stores)});
map.addLayer({id:'kiwi-points',type:'circle',source:'kiwi-stores',paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,4,10,7,15,9],'circle-color':['case',['==',['get','visited'],1],'#f5a623','#087b42'],'circle-stroke-color':'#ffffff','circle-stroke-width':1.6,'circle-opacity':0.95}});
map.on('click','kiwi-points',e=>{const id=e.features[0].properties.id;const s=stores.find(x=>x.id===id);if(s)showPopup(s)});
map.on('mouseenter','kiwi-points',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','kiwi-points',()=>map.getCanvas().style.cursor='');
render();
});
map.on('error',e=>{console.warn('Kartfeil',e.error)});
}else{$('map').innerHTML='<p style="padding:20px">Kartet kunne ikke lastes. Sjekk internettforbindelsen. Butikklisten fungerer fortsatt.</p>'}
render();
</script></body></html>
